<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vespa Search</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; margin: 2rem; }
      .row { display: flex; gap: .5rem; align-items: center; }
      input[type=text] { flex: 1; padding: .6rem .8rem; font-size: 1rem; }
      select, button { padding: .6rem .8rem; font-size: 1rem; }
      pre { background: #f6f8fa; padding: 1rem; border-radius: .5rem; overflow: auto; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { border: 1px solid #e1e4e8; padding: .5rem .6rem; text-align: left; vertical-align: top; }
      th { background: #fafbfc; }
      .section { margin-top: 1.2rem; }
      .hits { margin-top: 1rem; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <h2>Vespa Search</h2>
    <div class="row">
      <input id="q" type="text" placeholder="Hledat..." />
      <select id="method">
        <option value="fulltext">Fulltext</option>
        <option value="embedding">Embedding (ANN)</option>
        <option value="hybrid" selected>Hybrid</option>
      </select>
      <button onclick="doSearch()">Search</button>
    </div>
    <div class="row" style="margin-top:.5rem">
      <label class="muted">limit</label><input id="limit" type="number" value="10" style="width:6rem" />
      <label class="muted">k</label><input id="k" type="number" value="100" style="width:6rem" />
      <label class="muted">exact</label><input id="exact" type="checkbox" />
    </div>
    <div class="row" style="margin-top:.5rem">
      <label class="muted">GPS</label><input id="gps_lat" type="number" step="0.000001" placeholder="lat" style="width:8rem" value="41.88" />
      <input id="gps_lon" type="number" step="0.000001" placeholder="lon" style="width:8rem" value="87.63" />
      <label class="muted">radius (km)</label><input id="gps_radius" type="number" value="10" min="0.1" max="1000" step="0.1" style="width:6rem" />
      <!--<button onclick="getCurrentLocation()" style="font-size:0.8rem">📍 Get GPS</button>-->
    </div>
    <div class="hits">
      <div id="out" class="muted">Zadejte dotaz a stiskněte Search…</div>
    </div>
    <script src="/static/search.js"></script>
  </body>
</html>
