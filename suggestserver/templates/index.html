<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggest</title>
    <style>

        html {
            margin: 0;
            padding: 0;
            font-family: system-ui;
            background-color: #f0f0f0;
        }

        #suggestions {
            border: solid #000;
            border-width: 1px 1px 1px 1px;
            width: 400px;
            height: fit-content;
            margin: 0 auto;
            text-align: left;
            font-family: system-ui;
            background-color: white;
            margin-top: 24px;
            margin-right: 5px;
            overflow: hidden;
        }

        #suggestions img {
            width: 20px;
            height: 20px;
            margin-left: 0px;
            margin-right: 4px;
            margin-top: 0px;
            margin-bottom: 0px;
            float: left;
        }

        .page {
            width: 100%;
            text-align: center;
            display: inline-block;
        }

        .box {
            text-align: center;
            position: relative;
        }

        .logo {
            text-align: center;
            margin-top: 20px;
        }

        .searchbox {
            margin: 0;
            padding: 9px;
            width: 489px;
            height: 10px;
            font-family: system-ui;
            font-size: 16px;
        }

        .lat {
            margin: 0;
            padding: 9px;
            width: 80px;
            height: 10px;
            font-family: system-ui;
            font-size: 16px;
        }

        .lon {
            margin: 0;
            padding: 9px;
            width: 80px;
            height: 10px;
            font-family: system-ui;
            font-size: 16px;
        }

        .suggestion-item {
            padding-top: 5px;
            padding-left: 10px;
            padding-bottom: 5px;
            width: 400px;
            white-space: nowrap;
            display: inline-block;
        }

        .suggestion-label {
            padding-top: 5px;
            padding-left: 10px;
            padding-bottom: 5px;
            width: 498px;
            white-space: nowrap;
            font-weight: bold;
            font-size: 13px;
            color: gray;
        }

        .suggestion-item:hover,
        .active {
            background-color: #f0f0f0;
        }

        .container {
            width: 100%;
            display: inline-flex;
        }

        .searchResults {
            margin: auto;
            width:75%;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            width: 300px;
            z-index: 1;
        }

        .result-item {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            width: 375px;
        }

        .item-title {


        }
        
        .item-title_general {
            font-weight: bold;
            text-align: left;
            font-size: 17px;
            line-height: 1.375rem;
            margin: 0px;
        }
        
        .item-merchant {
            padding: 0px;
            margin: 0px;
            text-align: left;
            font-size: .875rem;
            line-height: 1.25rem;
        }

        .item-distance {
            padding: 0px;
            margin: 0px;
            text-align: left;
            font-size: .875rem;
            line-height: 1.25rem;
            color: green;
            font-weight: bold;
        }

        .item-weights {
            padding: 0px;
            margin: 0px;
            text-align: left;
            font-size: .75rem;
            line-height: 1.2rem;
            color: rgb(21, 0, 248);
            font-weight: bold;
        }

        .result-item img {
            max-width: 100%;
            height: auto;
        }

        .btn-container {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            width: 80px;
            height: 10px;
            font-family: system-ui;
            font-size: 16px;
            padding-top: 6px;
            padding-bottom: 26px;
        }
    </style>
</head>

    <script>
        const searchInput = document.getElementById('search');
        const suggestionsBox = document.getElementById('suggestions');

        let selectedIndex = -1;
        //let searchdata = [];
        let suggestions = [];
        let lastPosition = {
                latitude: 0,
                longitude: 0
        };
        window.pageStart = 0;
        window.pageLimit = 21;

        sendAnnotate = () => {
            searchdata = window.searchdata;
            const annotations = [];
            const resultsContainer = document.querySelectorAll('.result-item');

            resultsContainer.forEach((item, index) => {
                const id = searchdata.results[index].id;
                const vectorDistance = searchdata.results[index].features.vector_distance;
                const unigramWeight = searchdata.results[index].features.unigram_weight;
                const unigram_ocurrency = searchdata.results[index].features.unigram_ocurrency;
                const bigramWeight = searchdata.results[index].features.bigram_weight;
                const bigram_ocurrency = searchdata.results[index].features.bigram_ocurrency;
                const trigramWeight = searchdata.results[index].features.trigram_weight;
                const trigram_ocurrency = searchdata.results[index].features.trigram_ocurrency;
                const vector_distance = searchdata.results[index].features.vector_distance;
                const distance = searchdata.results[index].features.distance;
                const annotation = item.querySelector(`select[name="annotate-${id}"]`).value;

                annotations.push({
                    id: id,
                    unigramWeight: unigramWeight,
                    unigramOcurrency: unigram_ocurrency,
                    bigramWeight: bigramWeight,
                    bigramOcurrency: bigram_ocurrency,
                    trigramWeight: trigramWeight,
                    trigramOcurrency: trigram_ocurrency,
                    vectorDistance: vector_distance,
                    distance: distance,
                    annotation: annotation
                });
            });

            //console.log("anno:"+ JSON.stringify(annotations));
            
            fetch('/annotate', {
            method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    annotations : annotations,
                    q: searchInput.value,
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Annotations saved:', data);
            })
            .catch(error => {
                console.error('Error saving annotations:', error);
            });
        }

        previous = () => {
            const resultsContainer = document.querySelector('.results-container');
            if (resultsContainer) {
                resultsContainer.remove();
            }

            window.pageStart--;
            if (window.pageStart < 0) {
                window.pageStart = 0;
            }
            let u = '/search?q=' + searchInput.value + '&lat=' + document.getElementById('lat').value + '&lon=' + document.getElementById('lon').value + '&limit=' + window.pageLimit + '&' + 'start='+ window.pageStart * window.pageLimit;
            console.log(u);
            fetch(u)  
                .then(response => response.json())
                .then(data => {
                    renderResult(data);
            });
        };

        pageNext = () => {
            const resultsContainer = document.querySelector('.results-container');
            if (resultsContainer) {
                resultsContainer.remove();
            }

            window.pageStart++;
            let u = '/search?q=' + searchInput.value + '&lat=' + document.getElementById('lat').value + '&lon=' + document.getElementById('lon').value + '&limit=' + window.pageLimit + '&' + 'start='+ window.pageStart * window.pageLimit;
            console.log(u);
            fetch(u)  
                .then(response => response.json())
                .then(data => {
                    renderResult(data);
            });
        };

        suggest = function () {
            const query = searchInput.value;

            clearTimeout(this.typingTimer);
            this.typingTimer = setTimeout(() => {
                fetch('/suggest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        lat: lastPosition.latitude,
                        lon: lastPosition.longitude,
                        division: document.querySelector('select').value
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        suggestions = data;
                        //selectedIndex = -1;
                        //searchInput.value = selectedSuggestion;
                        renderSuggestions(suggestions);
                    });
            }, 300);
        };

        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') {
                selectedIndex++;
                highlightSuggestion();
            } else if (e.key === 'ArrowUp') {
                selectedIndex--;
                highlightSuggestion();
            } else if (e.key === 'Enter') {
                clearTimeout(this.typingTimer);
                this.typingTimer = setTimeout(() => {
                    removeSuggestions();
                    const resultsContainer = document.querySelector('.results-container');
                    if (resultsContainer) {
                        resultsContainer.remove();
                    }

                    fetch('/search?q=' + searchInput.value + '&lat=' + document.getElementById('lat').value + '&lon=' + document.getElementById('lon').value + '&limit=21')
                        .then(response => response.json())
                        .then(data => {
                            renderResult(data);
                    });
                    window.pageStart = 0;

                }, 300);
            }
        });

        searchInput.addEventListener('input', function () {
            console.log('change');
            clearTimeout(this.typingTimer);
                this.typingTimer = setTimeout(() => {
                    removeSuggestions();
                    const resultsContainer = document.querySelector('.results-container');
                    if (resultsContainer) {
                        resultsContainer.remove();
                    }

                    fetch('/search?q=' + searchInput.value + '&lat=' + document.getElementById('lat').value + '&lon=' + document.getElementById('lon').value + '&limit=21')  
                        .then(response => response.json())
                        .then(data => {
                            renderResult(data);
                    });

                    suggest();

                }, 300);
        });

        searchInput.addEventListener('click', function () {
            console.log('click');
            clearTimeout(this.typingTimer);
            fetch('/top?lat=' + document.getElementById('lat').value + '&lon=' + document.getElementById('lon').value)
                .then(response => response.json())
                .then(data => {
                    suggestions = data;
                    selectedIndex = -1;
                    //renderSuggestions(suggestions);
                });
        });

        const handleSelection = (selectedSuggestion) => {
            const selectedSuggestions = encodeURIComponent(selectedSuggestion);

            clearTimeout(this.typingTimer);
            this.typingTimer = setTimeout(() => {
                fetch('/suggest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: selectedSuggestions,
                        lat: lastPosition.latitude,
                        lon: lastPosition.longitude,
                        division: document.querySelector('select').value
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        suggestions = data;
                        selectedIndex = -1;
                        searchInput.value = selectedSuggestion;
                        renderSuggestions(suggestions);
                    });
            }, 300);

        };
        
        window.renderResult = (searchdata) => {
            //removeSearch();
            window.searchdata = searchdata;
            console.log(searchdata);

            const ids = searchdata.results.map(item => item.id).join(',');
            if (ids.length === 0) {
            return;
            }

            fetch(`/get_title_by_ids_redis/${ids}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
            })
            .then(response => response.json())
            .then(data => {
            //console.log(searchdata);
            
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'results-container';
            resultsContainer.id = 'resultscontainer';

            let i = 0;
            data.forEach(item => {

                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';

                const img = document.createElement('img');
                img.src = item.med_image;
                img.alt = item.title_general;
                resultItem.appendChild(img);

                const merchant = document.createElement('p');
                merchant.textContent = item.merchant_name + ' [' + item.id + ']';
                merchant.className = 'item-merchant';
                resultItem.appendChild(merchant);

                const title_general = document.createElement('p');
                title_general.textContent = item.title_general;
                title_general.className = 'item-title_general';
                resultItem.appendChild(title_general);

                const title_distance = document.createElement('p');
                title_distance.textContent = ' [' + searchdata.results[i].features.distance + ' km]' + ' Vector dist.: ' + searchdata.results[i].features.vector_distance;
                title_distance.className = 'item-distance';
                resultItem.appendChild(title_distance);

                const weights = document.createElement('p');
                weights.className = 'item-weights';
                weights.textContent =
                searchdata.results[i].features.unigram_weight + '[' + searchdata.results[i].features.unigram_ocurrency + '] ' +
                searchdata.results[i].features.bigram_weight + '[' + searchdata.results[i].features.bigram_ocurrency + '] ' +
                searchdata.results[i].features.trigram_weight + '[' + searchdata.results[i].features.trigram_ocurrency + '] ' 
                ;

                const select = document.createElement('select');
                select.name = `annotate-${item.id}`;

                const optionYes = document.createElement('option');
                optionYes.value = 'yes';
                optionYes.textContent = 'yes';
                select.appendChild(optionYes);

                const optionSim = document.createElement('option');
                optionSim.value = 'sim';
                optionSim.textContent = 'sim';
                select.appendChild(optionSim);

                const optionNo = document.createElement('option');
                optionNo.value = 'no';
                optionNo.textContent = 'no';
                select.appendChild(optionNo);

                weights.appendChild(select);


                resultItem.appendChild(weights);

                resultsContainer.appendChild(resultItem);
                i++;
            });

            document.getElementById('searchResults').appendChild(resultsContainer);
            console.log(window.pageStart);
            if (window.pageStart == 0) {
                document.getElementById('previousBtn').disabled = true;
            } else {
                document.getElementById('previousBtn').disabled = false;
            }
            //document.body.appendChild(resultsContainer);
            });
        };


        const renderSuggestions = (suggestions) => {
            suggestionsBox.innerHTML = '';
            console.log(suggestions);

            if (suggestions.did_you_mean !== null &&
                suggestions.did_you_mean !== undefined &&
                suggestions.did_you_mean !== '') {           
                
                const div = document.createElement('div');
                div.className = 'suggestion-label';
                div.textContent = "Did you mean?";
                suggestionsBox.appendChild(div);
                
                const div2 = document.createElement('div');
                div2.className = 'suggestion-item';
                div2.textContent = suggestions.did_you_mean;

                const div1 = document.createElement('img');
                div1.src = 'static/query.png';
                div2.appendChild(div1);
                div.appendChild(div2);
                
                suggestionsBox.appendChild(div2);

                div2.addEventListener('click', () => handleSelection(suggestions.did_you_mean));
            }

            if (suggestions.cleaned_query) {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = "Cleaned query:" + suggestions.cleaned_query;

                suggestionsBox.appendChild(div);
            }

            if (suggestions.suggested_query.length) {
                const div = document.createElement('div');
                div.className = 'suggestion-label';
                div.textContent = "Queries";
                suggestionsBox.appendChild(div);
            }

            suggestions.suggested_query.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item;

                const divI = document.createElement('img');
                divI.src = 'static/query.png';
                div.appendChild(divI);

                div.addEventListener('click', () => handleSelection(item));

                if (index === selectedIndex) {
                    div.classList.add('active');
                }

                suggestionsBox.appendChild(div);
            });


            
        };

        const highlightSuggestion = () => {
            const items = document.querySelectorAll('.suggestion-item');
            items.forEach((item, index) => {
                if (index === selectedIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        };
        
        const removeSearch = () => {
            //const item = document.getElementById('resultscontainer');
            //item.innerHTML = '';
        };

        const removeSuggestions = () => {
            const item = document.getElementById('suggestions');
            item.innerHTML = '';
        };

        function checkPosition() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const currentPosition = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };

                    if (lastPosition === null ||
                        lastPosition.latitude !== currentPosition.latitude ||
                        lastPosition.longitude !== currentPosition.longitude) {
                        lastPosition = currentPosition;
                        console.log("New position: ", currentPosition);
                        //sendPositionToServer(currentPosition);
                    }
                }, (error) => {
                    console.error("Error getting position: ", error);
                });
            } else {
                console.error("Geolocation is not supported by this browser.");
            }
        }

        setInterval(checkPosition, 5000);
    </script>
</body>

</html>
